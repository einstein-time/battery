[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "battery-thermal-surrogate"
version = "0.1.0"
description = "Physics-Informed ML Surrogate for 2D Battery Thermal Management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Battery Thermal Team"},
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.3",
    "scipy>=1.10.1",
    "matplotlib>=3.7.1",
    "h5py>=3.9.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "seaborn>=0.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
