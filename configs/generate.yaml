# Data Generation Configuration
# ==============================

data:
  output_path: data/raw/thermal_dataset.h5
  n_trajectories: 200   # Reduce for laptops; use 2000 on workstations
  n_steps: 200         # Time steps per trajectory (subsample from full solve)
  grid_size: 64        # Use 128 on machines with 16+ GB RAM
  dt: 0.001            # seconds
  total_time: 1.0      # seconds
  n_workers: 1         # Sequential; increase on machines with more RAM

physics:
  dx: 0.001            # meters (grid spacing)
  dy: 0.001
  rho: 2500.0          # kg/m^3
  cp: 700.0            # J/(kg*K)
  T_amb: 298.15        # K

  # Parameter sampling ranges
  k_range: [0.5, 5.0]         # W/(m*K)
  q_range: [1.0e+5, 5.0e+6]   # W/m^3
  h_range: [10.0, 500.0]      # W/(m^2*K)
  freq_range: [0.5, 5.0]      # Hz (heat source oscillation)

  # Material properties
  materials:
    cell:
      rho: 2500.0
      cp: 700.0
    coolant_air:
      k: 0.026
      rho: 1.225
      cp: 1006.0
    coolant_water:
      k: 0.6
      rho: 998.0
      cp: 4182.0
    insulation:
      k: 0.04
      rho: 30.0
      cp: 1400.0

# Quick test configuration (overrides above)
quick_test:
  n_trajectories: 10
  n_steps: 50
  grid_size: 32
